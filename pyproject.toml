[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-analysis-tool"
version = "0.1.0"
description = "A fast, portable dashboard backend for analysing Git repository history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "python-multipart>=0.0.12,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.7,<1.0",
]

[project.scripts]
rat-api = "rat.main:run"
rat-verify = "rat.verification:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rat"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
